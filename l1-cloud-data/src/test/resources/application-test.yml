spring:
  datasource:
    url: jdbc:h2:mem:l1test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 21MB
l1:
  demo:
    seed-enabled: false
l2:
  storage:
    root: ./target/test-uploads
  import:
    max-rows: 50000
    batch-size: 500
