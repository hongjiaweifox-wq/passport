server:
  port: 8080
  error:
    include-message: never
spring:
  application:
    name: passport-cloud
  datasource:
    url: jdbc:h2:file:./data/l1-passport;MODE=MySQL;DATABASE_TO_LOWER=TRUE;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 21MB
  h2:
    console:
      enabled: false
l1:
  demo:
    seed-enabled: true
l2:
  storage:
    root: ./data/uploads
  import:
    max-rows: 50000
    batch-size: 500
